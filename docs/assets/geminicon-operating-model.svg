<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="step-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="240" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- Step 1 -->
  <g transform="translate(30, 40)">
    <rect width="200" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#38bdf8"/>
    <text x="35" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">1</text>
    <text x="35" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Know the ground</text>
    <text x="35" y="110" font-family="sans-serif" font-size="12" fill="#94a3b8">Adopt safely or define charter before technology.</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 240 120 L 270 120" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Step 2 -->
  <g transform="translate(280, 40)">
    <rect width="200" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#818cf8"/>
    <text x="35" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">2</text>
    <text x="35" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Choose the work</text>
    <text x="35" y="110" font-family="sans-serif" font-size="12" fill="#94a3b8">Route request to smallest proportionate skill.</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 490 120 L 520 120" stroke="#818cf8" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Step 3 -->
  <g transform="translate(530, 40)">
    <rect width="200" height="160" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#c084fc"/>
    <text x="35" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">3</text>
    <text x="35" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Prove the result</text>
    <text x="35" y="110" font-family="sans-serif" font-size="12" fill="#94a3b8">Run canonical lint, test, and security gates.</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 740 120 L 770 120" stroke="#c084fc" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Step 4 -->
  <g transform="translate(780, 40)">
    <rect width="190" height="160" rx="12" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#4ade80"/>
    <text x="35" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">4</text>
    <text x="35" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Cross boundary</text>
    <text x="35" y="110" font-family="sans-serif" font-size="12" fill="#94a3b8">Explicit authority for commits, pushes, &amp; deploys.</text>
  </g>
</svg>
